<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đọc sách — Sách Giáo Khoa Trí Tuệ Nhân Tạo THPT</title>
  <meta name="description" content="Đọc sách giáo khoa Trí tuệ nhân tạo Lớp 10, Lớp 11, Lớp 12 định dạng văn bản HTML hiện đại, dễ đọc, tìm kiếm toàn văn và mục lục bài học." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css?v=20261126-v13" />
</head>
<body class="reader-body">
  <header class="reader-toolbar">
    <div class="toolbar-group">
      <a href="index.html" class="icon-btn" title="Về Tủ sách">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        <span class="hide-sm">Tủ sách</span>
      </a>

      <button id="toggleSidebarBtn" class="icon-btn active" title="Mục lục & Tìm kiếm (T)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>

      <div id="bookSwitcher" class="book-switcher" role="navigation" aria-label="Chọn lớp"></div>
    </div>

    <div class="toolbar-group">
      <span id="lessonIndicator" class="lesson-indicator">Đang tải bài học...</span>
    </div>

    <div class="toolbar-group">
      <!-- Cỡ chữ -->
      <div class="font-size-control" title="Điều chỉnh cỡ chữ">
        <button id="btnFontDec" aria-label="Giảm cỡ chữ">A−</button>
        <button id="btnFontInc" aria-label="Tăng cỡ chữ">A+</button>
      </div>

      <!-- Xem bản in gốc -->
      <button id="btnViewScan" class="icon-btn hide-sm" title="Xem bản in gốc của bài học này">
        📖 <span class="hide-md">Bản in gốc</span>
      </button>

      <!-- Đổi giao diện Sáng / Giấy ấm / Tối -->
      <button id="themeCycleBtn" class="icon-btn" title="Chuyển giao diện Sáng / Giấy ấm / Tối">☀️</button>

      <!-- Toàn màn hình -->
      <button id="fullscreenBtn" class="icon-btn hide-sm" title="Toàn màn hình (F)">⛶</button>
    </div>
  </header>

  <div class="reader-workspace">
    <!-- Sidebar Mục lục & Tìm kiếm -->
    <aside id="readerSidebar" class="reader-sidebar">
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" data-tab="toc">Mục lục</button>
        <button class="sidebar-tab" data-tab="search">Tìm kiếm</button>
      </div>

      <div id="tabToc" class="sidebar-panel active">
        <!-- Rendered by reader.js -->
      </div>

      <div id="tabSearch" class="sidebar-panel">
        <input id="sidebarSearchInput" class="sidebar-search-input" type="search" placeholder="Tìm kiếm nội dung bài học..." autocomplete="off" />
        <div id="sidebarSearchResults"></div>
      </div>
    </aside>

    <!-- Reading Stage -->
    <main id="textReaderStage" class="text-reader-stage" tabindex="0">
      <div class="text-reader-layout">
        <article id="lessonContent" class="lesson-article-wrap">
          <!-- Rendered by reader.js -->
          <div style="text-align: center; padding: 60px 20px; color: var(--text-soft);">
            <div style="font-size: 32px; margin-bottom: 12px;">📖</div>
            <p>Đang tải nội dung sách giáo khoa...</p>
          </div>
        </article>

        <!-- Right Mini Outline -->
        <aside id="readerOutline" class="reader-outline">
          <div class="outline-title">Nội dung bài học</div>
          <ul id="outlineList" class="outline-list">
            <!-- Rendered by reader.js -->
          </ul>
        </aside>
      </div>
    </main>
  </div>

  <!-- Modal xem bản in gốc tương ứng -->
  <div id="scanModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="scanModalTitle">
    <div class="scan-modal-card">
      <div class="modal-head">
        <h3 id="scanModalTitle">Bản in gốc</h3>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button id="scanPrevBtn" class="icon-btn" title="Trang trước">‹</button>
          <span id="scanPageIndicator" style="font-size: 13.5px; font-weight: 600;">Trang 1 / 1</span>
          <button id="scanNextBtn" class="icon-btn" title="Trang sau">›</button>
          <button id="closeScanModal" class="icon-btn" aria-label="Đóng" style="margin-left: 8px;">✕</button>
        </div>
      </div>
      <div id="scanViewerStage" class="scan-viewer-stage">
        <img id="scanImage" src="" alt="Bản in trang sách" />
      </div>
    </div>
  </div>

  <script src="assets/js/reader.js?v=20261126-v13"></script>
</body>
</html>
